services:
  - type: web
    name: bms-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the latest snapshot is kept in memory.
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: INGEST_TOKEN
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
